{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="view-transition" content="same-origin">
    <title>{% block title %}Formula Lab{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'formulas/visuals/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'formulas/vendor/katex/katex.min.css' %}">
    <script defer src="{% static 'formulas/vendor/katex/katex.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'formulas/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'formulas/css/components/console.css' %}">
    <link rel="stylesheet" href="{% static 'formulas/css/components/katex-preview.css' %}">
    <link rel="stylesheet" href="{% static 'formulas/css/components/dashboard.css' %}">
    {% block page_css %}{% endblock %}
</head>
<body class="{% block body_class %}formula-page{% endblock %}">
    {% include "formulas/partials/nav.html" %}
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <script defer src="{% static 'formulas/js/generated/layout-intelligence.js' %}"></script>
    {% block page_js %}{% endblock %}
</body>
</html>
