services:
  web:
    platform: linux/amd64
    build: .
    command: /app/scripts/entrypoint-web.sh
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - .:/app
      - ./media:/app/media
      - ./.model-cache:/app/.model-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    platform: linux/amd64
    build: .
    command: /app/scripts/entrypoint-worker.sh
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      FORMULA_LAB_RECOGNITION_BACKEND: http
      FORMULA_LAB_MODEL_API_URL: http://model-api:9000
    volumes:
      - .:/app
      - ./media:/app/media
      - ./.model-cache:/app/.model-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-api:
        condition: service_healthy

  model-api:
    platform: linux/amd64
    build: .
    command: python -m uvicorn model_service.main:app --host 0.0.0.0 --port 9000
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      FORMULA_LAB_OCR_ENGINE: paddle
    expose:
      - "9000"
    ports:
      - "9000:9000"
    volumes:
      - .:/app
      - ./.model-cache:/app/.model-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://localhost:9000/warmup >/dev/null"]
      interval: 30s
      timeout: 300s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: formula_lab
      POSTGRES_USER: formula_lab
      POSTGRES_PASSWORD: formula_lab_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formula_lab -d formula_lab"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
