services:
  web:
    build: .
    command: /app/scripts/entrypoint-web.sh
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./.model-cache:/app/.model-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: /app/scripts/entrypoint-worker.sh
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - .:/app
      - ./media:/app/media
      - ./.model-cache:/app/.model-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: formula_lab
      POSTGRES_USER: formula_lab
      POSTGRES_PASSWORD: formula_lab_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formula_lab -d formula_lab"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
